<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trailer compositor</title>
    <style>
      @font-face { font-family: 'Cinzel'; font-weight: 500; src: url(fonts/cinzel-latin-500-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Cinzel'; font-weight: 700; src: url(fonts/cinzel-latin-700-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Cinzel'; font-weight: 900; src: url(fonts/cinzel-latin-900-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Cormorant'; font-style: italic; font-weight: 500; src: url(fonts/cormorant-garamond-latin-500-italic.woff2) format('woff2'); }
      @font-face { font-family: 'Cormorant'; font-weight: 600; src: url(fonts/cormorant-garamond-latin-600-normal.woff2) format('woff2'); }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #f4ead8; font-family: 'Cinzel', serif; }
      #stage > * { position: absolute; }
      canvas { inset: 0; }
      .gold { color: #f1cf86; background: linear-gradient(180deg, #fff3cf 0%, #f0c977 45%, #b27a2c 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .title { left: 0; right: 0; top: 400px; text-align: center; font-weight: 900; font-size: 168px; letter-spacing: 0.32em; padding-left: 0.32em; filter: drop-shadow(0 0 30px rgba(255, 196, 96, 0.45)) drop-shadow(0 6px 10px rgba(0,0,0,0.8)); }
      .subtitle { left: 0; right: 0; top: 610px; text-align: center; font-size: 30px; letter-spacing: 0.6em; padding-left: 0.6em; color: #e9d7b2; text-shadow: 0 2px 8px #000; }
      .card { left: 150px; bottom: 260px; isolation: isolate; }
      .card::before { content: ''; position: absolute; left: -260px; right: -320px; top: -140px; bottom: -120px; z-index: -1; background: radial-gradient(ellipse at 40% 55%, rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0) 68%); }
      .card .name { font-weight: 900; font-size: 104px; letter-spacing: 0.12em; line-height: 1; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.9)); }
      .card .sub { margin-top: 14px; font-size: 32px; font-weight: 700; letter-spacing: 0.26em; color: #fff4dc; text-shadow: 0 0 6px #000, 0 2px 12px #000; }
      .card .rule { height: 3px; width: 520px; margin-top: 18px; background: linear-gradient(90deg, #f0c977, rgba(240,201,119,0)); }
      .heading { left: 0; right: 0; top: 150px; text-align: center; font-weight: 700; font-size: 64px; letter-spacing: 0.24em; padding-left: 0.24em; filter: drop-shadow(0 3px 10px rgba(0,0,0,0.9)); }
      .caption { left: 0; right: 0; bottom: 34px; text-align: center; font-family: 'Cormorant', serif; font-style: italic; font-size: 40px; color: #efe3c8; text-shadow: 0 2px 6px #000; }
      .chips { left: 0; right: 0; bottom: 150px; display: flex; justify-content: center; gap: 28px; }
      .chip { padding: 14px 34px; font-size: 38px; font-weight: 700; letter-spacing: 0.2em; color: #fff1cf; background: rgba(12, 8, 4, 0.62); border: 2px solid rgba(240, 201, 119, 0.85); border-radius: 6px; box-shadow: 0 0 28px rgba(255, 190, 90, 0.25); }
      .bar { left: 0; right: 0; top: 380px; display: flex; justify-content: center; gap: 30px; }
      .slot { position: relative; width: 170px; text-align: center; }
      .slot .ico { width: 170px; height: 170px; border-radius: 14px; overflow: hidden; border: 3px solid rgba(240, 201, 119, 0.8); box-shadow: 0 8px 30px rgba(0,0,0,0.7); background: #120d08; }
      .slot .ico svg { width: 100%; height: 100%; display: block; }
      .slot .key { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); width: 56px; height: 56px; line-height: 56px; border-radius: 50%; background: #1a120a; border: 2px solid #f0c977; font-weight: 700; font-size: 30px; color: #ffe7b0; }
      .slot .sn { margin-top: 14px; font-size: 24px; letter-spacing: 0.06em; color: #f4ead8; text-shadow: 0 2px 6px #000; }
      .slot.ult .ico { border-color: #ffcf6a; }
      .pool { left: 0; right: 0; top: 250px; display: grid; grid-template-columns: repeat(6, 132px); justify-content: center; gap: 22px 26px; }
      .pool .p { text-align: center; }
      .pool .p .ico { width: 132px; height: 132px; border-radius: 12px; overflow: hidden; border: 2px solid rgba(240, 201, 119, 0.55); background: #120d08; box-shadow: 0 6px 22px rgba(0,0,0,0.7); }
      .pool .p .ico svg { width: 100%; height: 100%; display: block; }
      .pool .p .sn { margin-top: 8px; font-size: 18px; letter-spacing: 0.04em; text-shadow: 0 2px 5px #000; }
      .pool .p.ult .ico { border-color: #ffcf6a; }
      .trees { left: 0; right: 0; top: 230px; display: flex; justify-content: center; gap: 70px; }
      .tree { width: 460px; padding: 26px 26px 30px; background: rgba(10, 7, 4, 0.66); border: 2px solid rgba(240, 201, 119, 0.5); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
      .tree h4 { margin: 0; text-align: center; font-size: 40px; letter-spacing: 0.14em; color: #ffe0a0; }
      .tree .theme { text-align: center; font-family: 'Cormorant', serif; font-style: italic; font-size: 26px; color: #d8c8a6; margin: 6px 0 20px; }
      .tier { display: flex; justify-content: center; gap: 22px; margin-top: 18px; }
      .node { position: relative; width: 92px; height: 92px; border-radius: 12px; overflow: hidden; border: 2px solid #5a4424; background: #120d08; }
      .node svg { width: 100%; height: 100%; display: block; }
      .node .rk { position: absolute; right: 4px; bottom: 2px; font-family: 'Cormorant', serif; font-weight: 600; font-size: 24px; color: #fff; text-shadow: 0 0 4px #000, 0 0 4px #000; }
      .points { left: 0; right: 0; top: 900px; text-align: center; font-size: 46px; letter-spacing: 0.2em; filter: drop-shadow(0 3px 8px #000); }
      .faces { left: 0; right: 0; top: 300px; display: flex; justify-content: center; gap: 34px; }
      .face { width: 300px; height: 375px; border: 3px solid rgba(240, 201, 119, 0.8); border-radius: 10px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.8); background: #1a120a; position: relative; }
      .face img { width: 100%; height: 100%; object-fit: cover; }
      .face b { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 0 14px; text-align: center; font-size: 36px; letter-spacing: 0.14em; background: linear-gradient(transparent, rgba(0,0,0,0.85)); }
      .flash { inset: 0; background: #fff; }
      .bars { inset: 0; pointer-events: none; }
      .bars::before, .bars::after { content: ''; position: absolute; left: 0; right: 0; height: 110px; background: #000; }
      .bars::before { top: 0; }
      .bars::after { bottom: 0; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./compose.ts"></script>
  </body>
</html>
